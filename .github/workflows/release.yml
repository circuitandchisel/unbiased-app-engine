name: Standalone engine release

on:
  push:
    tags:
      - "engine-v*"

permissions:
  contents: read

concurrency:
  group: standalone-engine-release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate release source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^engine-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$GITHUB_REF_NAME" = "engine-v$(cat VERSION)"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: make test
      - run: python3 scripts/test_install.py
      - name: Build checksum-verified runtime
        run: scripts/build-release.sh
      - name: Check native binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir native
          tar -xzf dist/release/*.tar.gz -C native
          test "$(native/unbiased-app-engine --version)" = "unbiased-app-engine $(cat VERSION)"
          test "$(native/pareto-app-server --version)" = "codex-app-server $(cat native/APP_SERVER_VERSION)"
          (cd native && sha256sum -c FILES.sha256)
      - name: Test real installer and offline protocol
        run: python3 scripts/smoke_release.py dist/release/*.tar.gz
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: engine-${{ matrix.platform }}
          path: dist/release/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: engine-*
          merge-multiple: true
          path: release
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: release-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: circuitandchisel
          repositories: unbiased-app-releases
      - name: Publish independently of desktop releases
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo=circuitandchisel/unbiased-app-releases
          version="$(cat VERSION)"
          for platform in linux-x64 linux-arm64; do
            asset="unbiased-app-engine-v$version-$platform.tar.gz"
            test -s "release/$asset"
            (cd release && sha256sum -c "$asset.sha256")
          done
          (cd release && cat *.sha256 > SHA256SUMS)
          printf 'Standalone engine %s\nPinned app-server: %s\nSource: %s/tree/%s\n' \
            "$version" "$(sed -n 's/^version = //p' engine.lock)" \
            "https://github.com/$GITHUB_REPOSITORY" "$GITHUB_SHA" > release/NOTES.txt
          # Create once; reruns never overwrite a published tag or its assets.
          gh release create "$GITHUB_REF_NAME" --repo "$repo" --draft --latest=false \
            --title "App engine $version" --notes-file release/NOTES.txt \
            release/*.tar.gz release/SHA256SUMS
          mkdir downloaded
          gh release download "$GITHUB_REF_NAME" --repo "$repo" --dir downloaded
          (cd downloaded && sha256sum -c SHA256SUMS)
          gh release edit "$GITHUB_REF_NAME" --repo "$repo" --draft=false --latest=false
          # Pointer changes last, only after all public assets are published.
          gh auth setup-git
          gh repo clone "$repo" public-release
          printf '%s\n' "$GITHUB_REF_NAME" > public-release/engine-latest.txt
          cd public-release
          git config user.name "Unbiased release bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add engine-latest.txt
          git commit -m "Publish standalone engine $version pointer"
          git push origin HEAD:main
